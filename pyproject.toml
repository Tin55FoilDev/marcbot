[project]
name = "marcbot"
version = "0.3.35"
description = "Personal automation bot for Marc"
requires-python = ">=3.14"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
